name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (works with a zip upload or loose files)
        run: |
          if [ -f YellowEq.zip ]; then
            mkdir -p _src
            unzip -o -q YellowEq.zip -d _src
            DIR=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          else
            DIR=.
          fi
          DIR=$(realpath "$DIR")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/YellowEq.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YellowEq-APK
          path: YellowEq.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yellow Eq (build ${{ github.run_number }})
          files: YellowEq.apk
